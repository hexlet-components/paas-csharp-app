[tools]
betterleaks = "latest"
dotnet = "11.0"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"

# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["dotnet restore PaasCsharpApp.slnx", "hk install"]

[tasks.test]
description = "Тесты HTTP-контракта приложения"
run = "dotnet test"

[tasks.build]
description = "Собрать приложение теми же шагами, что стадия сборки Dockerfile"
run = "dotnet publish src/PaasCsharpApp -c Release -o out"

[tasks.start]
description = "Собрать и запустить приложение командой из CMD Dockerfile"
depends = ["build"]
run = "dotnet out/PaasCsharpApp.dll"

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
